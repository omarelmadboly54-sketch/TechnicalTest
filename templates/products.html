<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 0; 
            background: #f4f4f4; 
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .card h4 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #333;
        }
        .card p {
            margin: 0 0 15px 0;
            color: #007BFF;
            font-weight: bold;
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <h2>Our Products</h2>
    <div class="grid" id="productGrid">
        {{range .products}}
        <div class="card">
            <div>
                <img src="{{.Thumbnail}}" alt="{{.Title}}">
                <h4>{{.Title}}</h4>
                <p>${{.Price}}</p>
            </div>
            <button onclick="handleBuyNow('{{.ID}}')">Buy Now</button>
        </div>
        {{end}}
    </div>

<script>
function handleBuyNow(productId) {
    const token = localStorage.getItem("token");
    if (!token) {
        localStorage.setItem("redirectUrl", `/checkout?product_id=${productId}`);
        window.location.href = "/signin";
    } else {
        window.location.href = `/checkout?product_id=${productId}`;
    }
}
</script>    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background: #f4f4f4; 
        }
        form { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            width: 250px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        h3 { 
            text-align: center; 
            margin-top: 0; 
            margin-bottom: 15px;
            color: #333;
        }
        input, button { 
            width: 100%; 
            padding: 8px; 
            margin: 6px 0; 
            box-sizing: border-box; 
        }
        button { 
            background: #007BFF; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        button:hover {
            background: #0056b3;
        }
        .links {
            text-align: center;
            margin-top: 12px;
        }
        .links a {
            font-size: 12px;
            color: #007BFF;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <form id = "loginForm">
        <h3>Login</h3>
        <input type="email" id="email" placeholder="Email" required>
        <input  type="password" id="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
        <p id="result" style="font-size: 13px;text-align: center;margin-top: 10px;font-weight: bold;"></p>
        <div class="links">
            <a href="/signup">Don't have an account? Sign Up</a>
        </div>
    </form>
    <script>
        document.getElementById('loginForm').addEventListener('submit',async(e)=>{e.preventDefault();
            const response = await fetch('/api/signin',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({
                    email:document.getElementById('email').value,
                    password:document.getElementById('password').value
                })
            });
            const data = await response.json();
            const resBox = document.getElementById('result');
            if (response.ok){
                resBox.style.color="green";
                resBox.innerText=data.message || "login successfull";
                if (data.data&& data.data.token){
                    localStorage.setItem("token",data.token);
                }
                const redirectTo = localStorage.getItem("redirectUrl")||"/";
                localStorage.removeItem("redirectUrl");
                setTimeout(()=>{
                    window.location.href=redirectTo;
                },500);
            }else{
                resBox.style.color="red";
                resBox.innerText = data.error||"login failed.";
            }
        });
    </script>
    
</body>
</html>
